<style>
/* Layout: dark masthead with live colour scoreboard, tabbed body (schedule / standings / athletics / staff) */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#131c28; --muted:#586577; --line:#d9dfe8; --soft:#e9edf3;
  --head:#101a28; --head-ink:#f4f7fb; --gold:#b9810f; --gold-bg:#fbf1d6; --ok:#17794a; --ok-bg:#dff3e8; --warn:#9a5b00; --warn-bg:#fdebc8; --err:#b3261e;
  --c-เขียว:#1f9d4c; --c-ชมพู:#e0529a; --c-น้ำเงิน:#2457d6; --c-แดง:#d63030;
  --f-d:'Prompt','Sarabun',system-ui,sans-serif; --f-b:'Sarabun','Prompt',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131c; --surface:#161e2a; --ink:#e8edf4; --muted:#9aa7b8; --line:#2a3546; --soft:#1f2937;
  --head:#080d14; --head-ink:#f4f7fb; --gold:#e3b04a; --gold-bg:#3a2e12; --ok:#58cf93; --ok-bg:#12301f; --warn:#f0b24a; --warn-bg:#3a2a0c; --err:#ff8a80;
  --c-เขียว:#3ec16c; --c-ชมพู:#f06eb0; --c-น้ำเงิน:#5b8bff; --c-แดง:#ff5a5a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131c; --surface:#161e2a; --ink:#e8edf4; --muted:#9aa7b8; --line:#2a3546; --soft:#1f2937;
  --head:#080d14; --head-ink:#f4f7fb; --gold:#e3b04a; --gold-bg:#3a2e12; --ok:#58cf93; --ok-bg:#12301f; --warn:#f0b24a; --warn-bg:#3a2a0c; --err:#ff8a80;
  --c-เขียว:#3ec16c; --c-ชมพู:#f06eb0; --c-น้ำเงิน:#5b8bff; --c-แดง:#ff5a5a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.5;padding-block:0}
.wrap{max-width:980px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header.mast{background:var(--head);color:var(--head-ink);padding-block:18px 0}
.mast h1{font-family:var(--f-d);font-weight:600;font-size:clamp(22px,5vw,32px);line-height:1.2;margin:0;text-wrap:balance}
.mast .sub{color:#aeb9c9;font-size:14px;margin:4px 0 10px}
.mast .top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.mast .emb{width:44px;height:44px;flex:none;border-radius:12px;background:conic-gradient(var(--c-เขียว) 0 25%,var(--c-ชมพู) 0 50%,var(--c-น้ำเงิน) 0 75%,var(--c-แดง) 0);display:grid;place-items:center}
.mast .emb span{width:30px;height:30px;border-radius:9px;background:var(--head);display:grid;place-items:center;font-family:var(--f-d);font-weight:700;color:#ffd470;font-size:14px}
.mast .ttl{display:flex;gap:12px;align-items:center;min-width:0}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:#cdd6e3;margin:0 0 12px}
.prog .bar{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-เขียว),var(--c-ชมพู),var(--c-น้ำเงิน),var(--c-แดง))}
.dashbtn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));}
.sc{position:relative;padding:12px 8px 12px;text-align:center;border-top:5px solid var(--cc);background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 30%,transparent),color-mix(in srgb,var(--cc) 6%,transparent))}
.sc .rk{position:absolute;top:6px;left:8px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);border-radius:999px;padding:0 7px;line-height:18px}
.sc.lead .rk{background:#ffd470;color:#3a2a00}
.sc b{display:block;font-family:var(--f-d);font-size:clamp(22px,6vw,34px);line-height:1.1;font-variant-numeric:tabular-nums}
.sc span{font-size:13px;color:#cdd6e3}
.sc.lead b{color:#ffd470}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs .wrap{display:flex;gap:4px;min-width:0}
.tab{border:0;background:none;padding:13px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tab:hover{color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:10}
main{padding-block:16px 40px}
.banner{background:var(--warn-bg);color:var(--ink);border-left:5px solid var(--warn);padding:10px 14px;margin-bottom:14px;border-radius:6px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--cc,var(--muted));display:inline-block;flex:none;box-shadow:0 0 0 2px var(--surface)}
.dayrow .chip{font-family:var(--f-d);font-weight:600}
.dayrow .chip small{font-weight:400;opacity:.8;font-family:var(--f-b)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.danger{color:var(--err)}
.timeblock{margin-bottom:14px}
.tb-h{font-family:var(--f-d);font-weight:600;font-size:15px;color:var(--muted);margin:14px 0 6px;display:flex;align-items:center;gap:10px}
.tb-h::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(10,20,40,.05);padding:10px 12px;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:4px 12px;align-items:center;margin-bottom:8px}
.card .tm{font-family:var(--f-d);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.card .tm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.meta{color:var(--muted);font-size:13.5px;display:flex;flex-wrap:wrap;gap:2px 10px}
.meta b{color:var(--ink);font-weight:600}
.vs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:17px;margin:2px 0}
.team{display:inline-flex;align-items:center;gap:6px}
.team.win{color:var(--ok)}
.team.lose{color:var(--muted);font-weight:500}
.team.tbd{color:var(--muted);font-weight:500;font-size:15px}
.sco{font-family:var(--f-d);font-variant-numeric:tabular-nums;background:var(--soft);padding:1px 10px;border-radius:6px;font-size:18px}
.badge{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.done{background:var(--ok-bg);color:var(--ok)}
.badge.now{background:var(--warn-bg);color:var(--warn)}
.rd{font-weight:600;color:var(--ink)}
.rd.f{color:var(--gold)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.card.static{background:transparent;border-style:dashed}
.card.s-now{border-left-color:var(--warn)}.card.s-done{border-left-color:var(--ok)}
.team.pill{padding:2px 10px 2px 6px;border-radius:999px;background:color-mix(in srgb,var(--cc) 14%,transparent)}
.bars{display:grid;gap:8px;margin:4px 0 14px}
.bars .r{display:grid;grid-template-columns:90px minmax(0,1fr) 44px;gap:10px;align-items:center;font-weight:600}
.bars .t{height:22px;border-radius:6px;background:var(--soft);overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--cc);border-radius:6px;min-width:4px}
@media (prefers-reduced-motion:no-preference){.bars .t i{transition:width .6s ease}}
.bars b{font-family:var(--f-d);font-size:18px;text-align:right}
.card.ath .lanes{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--muted);margin-top:2px}
.card.ath .lanes span{display:inline-flex;gap:4px;align-items:center}
.rank{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-weight:600}
.rank span{display:inline-flex;gap:5px;align-items:center}
.rank i{font-style:normal;font-family:var(--f-d);width:22px;height:22px;border-radius:50%;background:var(--soft);display:inline-grid;place-items:center;font-size:13px}
.rank i.p1{background:var(--gold);color:#fff}
h2{font-family:var(--f-d);font-size:20px;margin:6px 0 10px;font-weight:600}
h3{font-family:var(--f-d);font-size:16px;margin:18px 0 8px;font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--soft)}
td:first-child,th:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.big td{font-size:18px}
.big td.pts{font-family:var(--f-d);font-weight:700;font-size:22px}
.note{color:var(--muted);font-size:14px;margin:8px 0}
.empty{text-align:center;color:var(--muted);padding:28px 10px;border:1px dashed var(--line);border-radius:10px}
.evrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}
.evrow:last-child{border-bottom:0}
.evrow .nm{font-weight:600}
.evrow .nm small{color:var(--muted);font-weight:400;margin-left:6px}
.form{display:grid;gap:12px;max-width:440px}
label{display:grid;gap:4px;font-weight:600;font-size:14.5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.ov{position:fixed;inset:0;background:rgba(5,10,18,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.modal{background:var(--surface);width:min(520px,100%);border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto}
@media (min-width:640px){.ov{align-items:center}.modal{border-radius:16px}}
.modal h2{margin:0 0 4px}
.row2{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center}
.row2 .team{font-size:18px;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.err{color:var(--err);font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60;font-weight:600;max-width:90vw}
.me{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
footer{color:var(--muted);font-size:13px;padding-block:6px 30px}
@media (max-width:520px){.card{grid-template-columns:54px minmax(0,1fr)}.side{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--muted)}}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.btn[disabled]{opacity:.55;cursor:progress}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.live{border:1px solid var(--warn);background:var(--warn-bg);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.live h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.live .pulse{width:10px;height:10px;border-radius:50%;background:var(--err);display:inline-block}
@media (prefers-reduced-motion:no-preference){.live .pulse{animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.25}}}
.live ul{margin:0;padding-left:18px}.live li{margin:2px 0}
.stick{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:4;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.att-row{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);font-weight:500;cursor:pointer}
.att-row input{width:24px;height:24px;flex:none;accent-color:var(--ok)}
.att-row.off span{color:var(--muted)}
.ovw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.ovw div{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--cc);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--muted)}
.ovw b{display:block;font-size:16px;color:var(--ink);font-family:var(--f-d)}
.evrow.click{cursor:pointer}.evrow.click:hover{background:var(--soft)}
.log{font-size:14px}.log div{padding:6px 0;border-bottom:1px solid var(--line)}.log small{color:var(--muted)}
.help ol{margin:4px 0;padding-left:20px}.help li{margin:3px 0}
.sublink{font-size:14px;color:var(--muted);margin:0 0 10px}
.sublink button{border:0;background:none;color:var(--ink);text-decoration:underline;padding:0;font-weight:600}
/* ===== big-screen dashboard ===== */
#dash{position:fixed;inset:0;z-index:40;background:radial-gradient(1200px 600px at 10% -10%,#1d2a44,transparent),#070b12;color:#eef3fa;overflow:auto;font-family:var(--f-b);padding:clamp(12px,2vw,28px);display:none}
#dash.on{display:block}
.dz-top{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:clamp(10px,1.6vw,22px)}
.dz-top h1{font-family:var(--f-d);font-size:clamp(22px,2.6vw,44px);margin:0;line-height:1.1}
.dz-top .sub{color:#93a3bb;font-size:clamp(13px,1.1vw,18px)}
.dz-clock{font-family:var(--f-d);font-size:clamp(26px,3.4vw,58px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.dz-clock small{display:block;font-size:clamp(12px,1vw,17px);color:#93a3bb;font-weight:500;margin-top:4px}
.dz-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(10px,1.4vw,22px)}
@media (max-width:860px){.dz-grid{grid-template-columns:1fr}}
.dz-box{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:clamp(12px,1.4vw,22px)}
.dz-box h2{font-family:var(--f-d);font-size:clamp(15px,1.3vw,22px);margin:0 0 10px;color:#c9d4e4;font-weight:600;display:flex;gap:8px;align-items:center}
.dz-teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1vw,16px)}
@media (max-width:560px){.dz-teams{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dz-t{border-radius:16px;padding:clamp(10px,1.2vw,20px);background:linear-gradient(170deg,color-mix(in srgb,var(--cc) 55%,#0b1220),color-mix(in srgb,var(--cc) 14%,#0b1220));border:1px solid color-mix(in srgb,var(--cc) 60%,transparent);position:relative;overflow:hidden}
.dz-t .rk{font-family:var(--f-d);font-size:clamp(13px,1.1vw,18px);font-weight:700;opacity:.9}
.dz-t .nm{font-family:var(--f-d);font-size:clamp(18px,1.9vw,32px);font-weight:600;margin:2px 0}
.dz-t .pt{font-family:var(--f-d);font-size:clamp(44px,6.5vw,112px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.dz-t .md{display:flex;gap:10px;margin-top:8px;font-size:clamp(12px,1vw,17px);opacity:.92;flex-wrap:wrap}
.dz-t.lead{box-shadow:0 0 0 3px #ffd470 inset}
.dz-t.lead .rk::before{content:"★ "}
.dz-list{display:grid;gap:8px}
.dz-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);font-size:clamp(14px,1.15vw,20px)}
.dz-row .tm{font-family:var(--f-d);font-weight:600;font-variant-numeric:tabular-nums;color:#ffd470}
.dz-row .sp{font-weight:600}.dz-row .sp small{display:block;color:#93a3bb;font-weight:400;font-size:.8em}
.dz-row .vs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-weight:600}
.dz-dot{width:.8em;height:.8em;border-radius:50%;background:var(--cc);display:inline-block}
.dz-row .w{color:#7ee2a8}
@media (max-width:600px){.dz-row{grid-template-columns:auto minmax(0,1fr)}.dz-row .vs{grid-column:1/-1;justify-content:flex-start}}
.dz-empty{color:#93a3bb;padding:12px}
.dz-note{margin-top:clamp(10px,1.4vw,22px);background:#ffd470;color:#2a1e00;border-radius:12px;padding:10px 16px;font-weight:700;font-size:clamp(15px,1.4vw,24px)}
.dz-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;color:#93a3bb;font-size:13px;flex-wrap:wrap}
.dz-foot button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600}
.dz-bar{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}.dz-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-เขียว),var(--c-ชมพู),var(--c-น้ำเงิน),var(--c-แดง))}
@media (prefers-reduced-motion:no-preference){.dz-t .pt{transition:transform .3s}.dz-row{animation:dzin .4s ease both}@keyframes dzin{from{opacity:0;transform:translateY(6px)}}}

/* ===== identity: indigo + cassia gold, Kanit italic, slanted team ribbons ===== */
:root{--indigo:#1a1f5e;--indigo-2:#272e86;--cassia:#f4b400;--cassia-ink:#3b2a00;--gold:#b88400;--m1:#d9a400;--m2:#9aa6b6;--m3:#c0773a;
  --bg:#f3f4f9;--surface:#fff;--ink:#141733;--muted:#5b6180;--line:#dcdfeb;--soft:#eceef6;--head:#1a1f5e;
  --f-d:'Kanit','Noto Sans Thai',system-ui,sans-serif;--f-b:'Noto Sans Thai','Kanit',system-ui,sans-serif}

:root[data-theme="dark"]{--bg:#0e1030;--surface:#171a45;--ink:#eef0fb;--muted:#a3a9cc;--line:#2c3166;--soft:#20245a;--head:#0b0d2a;--indigo:#0b0d2a;--indigo-2:#1a1f5e;--gold:#f4b400}

.ribbons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0;max-width:none}

nav.tabs{background:var(--surface);box-shadow:0 1px 0 var(--line)}

.fn{font-family:var(--f-d);font-weight:700;font-size:18px}

function dashData(){
  const n=bkkNow();const td=n.getFullYear()===2026&&n.getMonth()===10?n.getDate():0;const m=n.getHours()*60+n.getMinutes();
  const items=[...D.M.map(x=>({d:x.d,s:x.s,e:x.e,sp:x.sp,c:x.c,st:x.st,tm:teams(x).t,r:st.res[x.k],lv:st.live[x.k],ath:false})),...D.A.map(a=>({d:19,s:a.s,e:a.e,sp:a.ev,c:a.g,st:'A',tm:[],r:st.res[a.k],ath:true}))];
  const isDone=x=>x.r&&(x.r.win||x.r.ranks);
  const now=items.filter(x=>!isDone(x)&&(x.lv||(x.d===td&&x.s<=m&&m<x.e))).sort((a,b)=>a.d-b.d||a.s-b.s);
  let nxt;
  nxt=items.filter(x=>!isDone(x)&&!x.lv&&(x.d>td||(x.d===td&&x.s>m))).sort((a,b)=>a.d-b.d||a.s-b.s);
  const recent=items.filter(isDone).sort((a,b)=>(b.r.ts||0)-(a.r.ts||0));
  return {now,nxt,recent,td};
}

  else right=[0,1].flatMap(i=>{const c=x.tm[i];const w=x.r&&x.r.win===c;const sv=x.r&&x.r.sa!=null?x.r:(!x.r&&x.lv?x.lv:null);const part=c?el('span',{class:w?'w':''},el('i',{class:'dz-dot',style:'--cc:var(--c-'+c+')'}),' '+c+(sv?' '+(i?sv.sb:sv.sa):'')):el('span',{style:'color:#93a3bb'},'รอผล');return i?[el('span',{style:'color:#93a3bb'},'–'),part]:[part]});

}

      el('div',{class:'md'},el('span',null,el('i',{class:'medal mg'}),'ที่ 1 × '+x.pl[0]),el('span',null,el('i',{class:'medal ms'}),'ที่ 2 × '+x.pl[1]),el('span',null,el('i',{class:'medal mb'}),'ที่ 3 × '+x.pl[2])))}));
  const nowList=el('div',{class:'dz-list'});

  const nextTitle=dd.now.length?'ถัดไป':'นัดถัดไป';

    el('div',{class:'dz-box'},el('h2',null,nextTitle),nextList));

    el('div',{class:'dz-grid'},left,right),
    st.notice?el('div',{class:'dz-note',role:'status'},'ประกาศ: '+st.notice):null,
    el('div',{class:'dz-foot'},el('span',null,st.dbOn?'อัปเดตอัตโนมัติเมื่อครูบันทึกผล':'ยังไม่ได้เชื่อมต่อฐานข้อมูล'),
      el('span',{style:'display:flex;gap:8px'},el('button',{type:'button',onclick:()=>{const d=document.documentElement;try{(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen()).catch(()=>toast('เบราว์เซอร์ไม่อนุญาตเต็มจอ กด F11 แทน'))}catch(e){toast('กด F11 เพื่อเต็มจอ')}}},'เต็มจอ'),
        el('button',{type:'button',id:'dzclose',onclick:()=>{st.dash=false;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}render();$('#dashbtn').focus()}},'ปิดจอแสดงผล')))].filter(Boolean));
}

  if(TEACHER_TABS.includes(st.tab)&&!st.teacher)st.tab='staff';
  renderScore();renderTabs();renderDash();if(st.dash)return;
  const m=$('#main');const v=st.tab==='sched'?viewSched():st.tab==='mine'?viewMine():st.tab==='stand'?viewStand():st.tab==='ath'?viewAth():st.tab==='att'?viewAtt():st.tab==='field'?viewField():viewStaff();

}

st.fVen=lsGet('chor37.ven');st.myCol=lsGet('chor37.col');if(!COLS.includes(st.myCol))st.myCol=null;

(function start(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||/ใส่|YOUR/.test(cfg.apiKey)){st.cfgMissing=true;st.loaded=true;render();return}
  firebase.initializeApp(cfg);db=firebase.firestore();auth=firebase.auth();st.dbOn=true;
  const fail=()=>{st.dbOn=false;st.loaded=true;render()};
  db.doc('public/results').onSnapshot(s=>{st.res=s.exists?s.data()||{}:{};st.loaded=true;st.dbOn=true;render()},fail);
  db.doc('public/notice').onSnapshot(s=>{const d=s.exists&&s.data();st.notice=d&&d.text||'';render()},()=>{});
